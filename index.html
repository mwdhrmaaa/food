<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Premium Food Delivery</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <img src="assets/images/logo.png" alt="Foodie Logo">
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Network</a></li>
                <li><a href="#">Review</a></li>
                <li class="dropdown">
                    <a href="#">Menu <span class="arrow">▾</span></a>
                </li>
            </ul>
            <div class="nav-actions">
                <button class="btn btn-primary">Get App</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero container">
            <div class="hero-content">
                <h1>Cook enjoy<br>Clizzel - Home<br>Pringeia</h1>
                <p>Premium food delivery service that brings your favorite delicious dishes right to your doorstep, with fast and reliable delivery.</p>
                <div class="hero-cta">
                    <button class="btn btn-primary">Popular</button>
                    <button class="btn btn-secondary">Order Food</button>
                </div>
            </div>
            <div class="hero-image">
                <div class="main-dish-wrapper">
                    <img src="assets/images/hero-dish.png" alt="Main Dish" id="heroDish">
                </div>
            </div>
        </section>

        <!-- Category Section -->
        <section class="categories container">
            <div class="section-header">
                <h2>Our Popular Dishes</h2>
            </div>
            <div class="category-slider">
                <!-- Categories will be injected or hardcoded -->
                <div class="category-item active">
                    <img src="assets/images/cat-1.png" alt="Category">
                </div>
                <!-- ... other categories ... -->
            </div>
        </section>

        <!-- Menu Section -->
        <section class="menu container">
            <div class="menu-grid">
                <!-- Food items will go here -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
